name: Update Existing PoC
description: Researcher updated an upstream PoC repository — refresh our archive entry.
title: "Update: [short vuln name]"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a security researcher has pushed changes to an existing PoC repository already in the archive.
        Copilot will find the matching entry, pull the latest changes, update the README and exploit files, and open a PR.

  - type: input
    id: repo_url
    attributes:
      label: Source Repository URL
      description: GitHub URL of the upstream PoC repo (same URL used during original ingestion).
      placeholder: "https://github.com/owner/repo"
    validations:
      required: true

  - type: textarea
    id: what_changed
    attributes:
      label: What Changed (optional)
      description: Brief description of what the researcher updated — new exploit stage, new technique, bug fix, etc.
      placeholder: "e.g. Added full SYSTEM shell delivery via WER scheduled task hijack"
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have verified this is an update to an existing entry in the archive (not a new PoC).
          required: true
        - label: This is for authorized security research and educational purposes only.
          required: true
