name: Trigger monitor sweep

# Asks the CVE monitor (monitor.intelseclab.com) to sweep now instead of waiting
# for its own 06:17 UTC cron, then reports what it found.
#
# Why this exists: the sweep endpoint needs a Bearer token. Running it from here
# keeps that token in GitHub Secrets rather than on anyone's laptop. The public
# site never touches it — the watchlist page reads the unauthenticated /list.
#
# Deliberately manual-only: the Worker already sweeps daily, so a schedule here
# would just duplicate it.

on:
  workflow_dispatch:

permissions: {}          # needs no repository access at all

concurrency:
  group: monitor-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Request a sweep
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: |
          if [ -z "$MONITOR_API_KEY" ]; then
            echo "::error::MONITOR_API_KEY secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://monitor.intelseclab.com/sweep" \
            -H "Authorization: Bearer $MONITOR_API_KEY")
          echo "HTTP $code"
          cat /tmp/resp.json; echo
          case "$code" in
            202) echo "Sweep started." ;;
            409) echo "::warning::A sweep is already running — nothing to do."; exit 0 ;;
            401) echo "::error::Rejected. Is MONITOR_API_KEY current?"; exit 1 ;;
            *)   echo "::error::Unexpected response $code"; exit 1 ;;
          esac

      - name: Wait for completion and report
        run: |
          # The sweep runs detached on the Worker (ctx.waitUntil), so poll
          # /health rather than holding the HTTP connection open.
          #
          # Note: no embedded heredoc here. A previous version indented a
          # python3 <<'PY' body at column 0, which terminated the YAML block
          # scalar and made the whole workflow unparseable — GitHub then showed
          # it without a name and refused workflow_dispatch entirely.
          for i in $(seq 1 36); do
            sleep 30
            curl -sS "https://monitor.intelseclab.com/health?cb=$i" -o /tmp/h.json || continue
            finished=$(jq -r '.lastRun.finished_at // ""' /tmp/h.json)
            if [ -n "$finished" ]; then
              echo "Finished at $finished"
              jq -r '.lastRun | "  new CVEs        : \(.new_cves)\n  new critical    : \(.new_critical_cves)\n  CVEs searched   : \(.cves_searched)\n  new repos found : \(.new_repos_found)"' /tmp/h.json
              err=$(jq -r '.lastRun.error // ""' /tmp/h.json)
              if [ -n "$err" ]; then
                echo "::error::sweep reported: $err"
                exit 1
              fi
              exit 0
            fi
            echo "  still running… (${i}/36)"
          done
          echo "::warning::No completion reported within 18 minutes; check /health later."
