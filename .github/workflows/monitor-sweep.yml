name: Trigger monitor sweep

# Asks the CVE monitor (monitor.intelseclab.com) to sweep now instead of waiting
# for its own 06:17 UTC cron, then reports what it found.
#
# Why this exists: the sweep endpoint needs a Bearer token. Running it from here
# keeps that token in GitHub Secrets rather than on anyone's laptop. The public
# site never touches it — the watchlist page reads the unauthenticated /list.
#
# Deliberately manual-only: the Worker already sweeps daily, so a schedule here
# would just duplicate it.

on:
  workflow_dispatch:

permissions: {}          # needs no repository access at all

concurrency:
  group: monitor-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run sweep
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: |
          if [ -z "$MONITOR_API_KEY" ]; then
            echo "::error::MONITOR_API_KEY secret is not set."
            exit 1
          fi

          # The sweep endpoint streams keep-alive comments while working and
          # emits a single "data: {...}" line with the result at the end.
          # --max-time caps the total duration; --no-buffer ensures lines
          # print as they arrive.
          curl -sS --no-buffer --max-time 1080 \
            -X POST "https://monitor.intelseclab.com/sweep" \
            -H "Authorization: Bearer $MONITOR_API_KEY" \
            -o /tmp/sweep.log -w '\nHTTP %{http_code}\n'
          code=$?

          cat /tmp/sweep.log

          # Extract the final data line (SSE format)
          result=$(grep '^data: ' /tmp/sweep.log | tail -1 | sed 's/^data: //')

          if [ -z "$result" ]; then
            # Fallback: check /health in case the stream was interrupted
            # but the sweep completed server-side.
            echo "No result in stream — checking /health fallback..."
            curl -sS "https://monitor.intelseclab.com/health" -o /tmp/h.json
            finished=$(jq -r '.lastRun.finished_at // ""' /tmp/h.json)
            if [ -n "$finished" ]; then
              echo "Sweep completed (from /health):"
              jq -r '.lastRun | "  new CVEs        : \(.new_cves)\n  new critical    : \(.new_critical_cves)\n  CVEs searched   : \(.cves_searched)\n  new repos found : \(.new_repos_found)"' /tmp/h.json
              err=$(jq -r '.lastRun.error // ""' /tmp/h.json)
              if [ -n "$err" ]; then
                echo "::error::sweep reported: $err"
                exit 1
              fi
              exit 0
            fi
            echo "::error::Sweep produced no result and /health shows no completion."
            exit 1
          fi

          # Parse the SSE result JSON
          ok=$(echo "$result" | jq -r '.ok // false')
          if [ "$ok" = "true" ]; then
            echo "Sweep completed successfully:"
            echo "$result" | jq -r '"  new CVEs        : \(.newCves)\n  new critical    : \(.newCriticalCves)\n  CVEs searched   : \(.cvesSearched)\n  new repos found : \(.newReposFound)"'
          else
            err=$(echo "$result" | jq -r '.error // "unknown"')
            echo "::error::sweep failed: $err"
            exit 1
          fi
