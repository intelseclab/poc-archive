name: Build & deploy site

on:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Hugo (extended)
        env:
          HUGO_VERSION: "0.147.9"
        run: |
          wget -q -O /tmp/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Regenerate INDEX.md and data.json
        run: bash scripts/index.sh

      - name: Generate Hugo content pages
        run: python3 scripts/build-hugo-content.py

      - name: Build Hugo site → docs/
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ INDEX.md
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "ci: rebuild site [skip ci]"
            git push
          fi

      - name: Ping search engines
        run: |
          SITEMAP="https://poc.intelseclab.com/sitemap.xml"
          curl -sf "https://www.google.com/ping?sitemap=${SITEMAP}" -o /dev/null && echo "Google pinged" || echo "Google ping failed"
          curl -sf "https://www.bing.com/ping?sitemap=${SITEMAP}" -o /dev/null && echo "Bing pinged" || echo "Bing ping failed"
          curl -sf "https://webmaster.yandex.com/ping?sitemap=${SITEMAP}" -o /dev/null && echo "Yandex pinged" || echo "Yandex ping failed"
