<header class="sticky top-0 z-40 border-b border-zinc-200/80 bg-white/80 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/80">
  <div class="mx-auto flex w-full max-w-6xl items-center gap-4 px-4 py-3 sm:px-6 lg:px-8">
    <a href="{{ "/" | relURL }}" class="flex items-center gap-2 font-mono text-sm font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">
      <img src="{{ "favicon.svg" | relURL }}" width="36" height="36" alt="PoC Archive" />
      <span>PoC Archive</span>
    </a>

    <nav class="ml-2 hidden items-center gap-1 text-sm sm:flex">
      {{ $p := .RelPermalink }}
      <a href="{{ "/" | relURL }}" class="rounded-md px-3 py-1.5 text-zinc-600 transition hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-900 dark:hover:text-zinc-100{{ if eq $p "/" }} !text-emerald-600 dark:!text-emerald-400{{ end }}">home</a>
      <a href="{{ "/pocs/" | relURL }}" class="rounded-md px-3 py-1.5 text-zinc-600 transition hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-900 dark:hover:text-zinc-100{{ if hasPrefix $p "/pocs" }} !text-emerald-600 dark:!text-emerald-400{{ end }}">pocs</a>
      <a href="{{ "/archive/" | relURL }}" class="rounded-md px-3 py-1.5 text-zinc-600 transition hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-900 dark:hover:text-zinc-100{{ if hasPrefix $p "/archive" }} !text-emerald-600 dark:!text-emerald-400{{ end }}">archive</a>
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <a href="{{ .Site.Params.repoURL }}" target="_blank" rel="noopener noreferrer" class="hidden rounded-md border border-zinc-200 px-3 py-1.5 text-xs font-medium text-zinc-700 transition hover:bg-zinc-100 sm:inline-flex dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-900">
        GitHub
      </a>
      <button
        type="button"
        id="theme-toggle"
        aria-label="Toggle color theme"
        class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-zinc-200 text-zinc-700 transition hover:bg-zinc-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-900"
      >
        <svg class="hidden h-4 w-4 dark:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="block h-4 w-4 dark:hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </div>

  <!-- Mobile nav -->
  <nav class="flex items-center gap-1 border-t border-zinc-200 px-4 py-2 text-sm sm:hidden dark:border-zinc-800">
    <a href="{{ "/" | relURL }}" class="rounded-md px-3 py-1.5 text-zinc-600 dark:text-zinc-400">home</a>
    <a href="{{ "/pocs/" | relURL }}" class="rounded-md px-3 py-1.5 text-zinc-600 dark:text-zinc-400">pocs</a>
    <a href="{{ "/archive/" | relURL }}" class="rounded-md px-3 py-1.5 text-zinc-600 dark:text-zinc-400">archive</a>
  </nav>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var isDark = root.classList.toggle('dark');
        try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>
</header>
