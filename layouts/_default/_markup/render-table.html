<div class="overflow-x-auto">
  <table>
    {{ with .THead }}
    <thead>
      {{ range . }}
      <tr>
        {{ range . }}
        <th{{ with .Alignment }} align="{{ . }}"{{ end }}>{{ .Text }}</th>
        {{ end }}
      </tr>
      {{ end }}
    </thead>
    {{ end }}
    <tbody>
      {{ range .TBody }}
      <tr>
        {{ range . }}
        <td{{ with .Alignment }} align="{{ . }}"{{ end }}>{{ .Text }}</td>
        {{ end }}
      </tr>
      {{ end }}
    </tbody>
  </table>
</div>
