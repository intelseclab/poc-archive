baseURL = "https://poc.intelseclab.com/"
languageCode = "en-us"
title = "PoC Archive"
enableRobotsTXT = true
publishDir = "docs"

# Show all pages; PoC dates may be in the future relative to build.
buildFuture = true

[pagination]
  pagerSize = 500

[taxonomies]
  category = "categories"
  tag = "tags"
  severity = "severities"

[outputs]
  home = ["HTML", "JSON"]

[params]
  description = "A curated archive of security research proof-of-concept exploits. Reproducible writeups across web, network, binary, crypto, cloud, hardware, and social-engineering categories."
  author = "intelseclab"
  repoURL = "https://github.com/intelseclab/poc-archive"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']
