baseURL = "https://poc.intelseclab.com/"
languageCode = "en-us"
title = "PoC Archive"
enableRobotsTXT = true
publishDir = "docs"

# Show all pages; PoC dates may be in the future relative to build.
buildFuture = true

[pagination]
  pagerSize = 500

[taxonomies]
  category = "categories"
  tag = "tags"
  severity = "severities"

[outputs]
  home = ["HTML", "JSON", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML", "plain"]

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]
  [mediaTypes."application/octet-stream"]
    suffixes = ["py", "sh", "rb", "c", "cpp", "go", "js", "php", "pl", "ps1", "java", "bat"]

[outputFormats]
  [outputFormats.plain]
    mediaType = "text/plain"
    baseName = "raw"
    isPlainText = true
    notAlternative = true

[params]
  description = "A curated archive of security research proof-of-concept exploits. Reproducible writeups across web, network, binary, crypto, cloud, hardware, and social-engineering categories."
  author = "intelseclab"
  repoURL = "https://github.com/intelseclab/poc-archive"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']
